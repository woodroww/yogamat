[package]
name = "yogamat"
version = "0.1.0"
edition = "2024"

resolver = "2"

[profile.dev.package."*"]
opt-level = 3

[profile.wasm-release]
inherits = "release"
opt-level = "z" 
lto = "fat"
codegen-units = 1

[lib]
name = "yogamat_wasm"
crate-type = ["cdylib", "rlib"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.18.0" }
rusqlite = "0.37.0"
# rusqlite = "0.38.0"

[dependencies]
bevy = { version = "0.18.0", features = ["serialize", "bevy_ui"] }
bevy_egui = "0.39.0"
bincode = { version = "2.0.1", features =["serde", "derive"] }
serde = "1.0.228"
wasm-bindgen = "0.2.108"
bevy_panorbit_camera = { version = "0.34.0", features = ["bevy_egui"] }
transform-gizmo-bevy = { path = "../transform-gizmo/crates/transform-gizmo-bevy" }
# bevy_mod_outline = "0.10.3"
egui = "0.33.3"
fuzzy-matcher = "0.3.7"
